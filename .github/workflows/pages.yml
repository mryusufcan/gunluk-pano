name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Testler
        run: |
          npm ci
          npm test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python testleri
        run: |
          pip install openpyxl
          python -m unittest discover tests

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p dist
          # Yalnızca yayınlanacak dosyalar; test, araç ve depo dosyaları pakete girmez.
          cp -r index.html styles.css app.js sw.js content.json phones.enc manifest.webmanifest assets onizleme sakin dist/
          # Önbellek adını commit ile eşle; elle sürüm artırmak gerekmez.
          sed -i "s/__CACHE_VERSION__/${GITHUB_SHA::7}/" dist/sw.js
          # Tarayıcının 10 dakikalık HTTP önbelleğini atlamak için dosya adlarına sürüm ekle.
          sed -i "s|\./app\.js|./app.js?v=${GITHUB_SHA::7}|; s|\./styles\.css|./styles.css?v=${GITHUB_SHA::7}|" dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
